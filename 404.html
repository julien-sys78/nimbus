<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page introuvable — Nimbus</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/nimbus/icons/icon.svg" type="image/svg+xml" />
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased;
      background: radial-gradient(ellipse 80% 70% at 15% 20%, #6d5dfc 0%, transparent 60%), radial-gradient(ellipse 70% 60% at 85% 30%, #ff7a9c 0%, transparent 60%), linear-gradient(160deg, #2b2d77, #8a3f8f 55%, #f08a5d); }
    main { max-width: 520px; padding: 40px 28px; border-radius: 24px; background: rgba(0,0,0,.45); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    p.code { margin: 0; font-size: 15px; font-weight: 600; opacity: .7; letter-spacing: .1em; }
    h1 { margin: 8px 0 12px; font-size: clamp(34px, 7vw, 52px); line-height: 1.05; letter-spacing: -.03em; }
    p { margin: 0 0 26px; font-size: 18px; color: rgba(255,255,255,.85); }
    a { display: inline-block; padding: 12px 24px; border-radius: 980px; background: #6d5dfc; color: #fff; text-decoration: none; font-size: 17px; }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">ERREUR 404</p>
    <h1>Ce fichier est introuvable.</h1>
    <p>Il a peut-être été déplacé dans la corbeille… ou n'a jamais existé.</p>
    <a href="/nimbus/">Retour au bureau</a>
  </main>
</body>
</html>
