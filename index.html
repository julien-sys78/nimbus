<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nimbus — mini OS</title>
  <meta name="description" content="Nimbus, un mini système d'exploitation interactif qui tourne dans le navigateur : fichiers, notes, terminal, musique et plus." />
  <meta name="theme-color" content="#1b1b1f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%236d5dfc'/%3E%3Cpath d='M7.2 18.5a4.7 4.7 0 0 1-.6-9.36 6 6 0 0 1 11.3 1.6 3.9 3.9 0 0 1-.4 7.76Z' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://images.unsplash.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/os.css" />
  <link rel="stylesheet" href="css/apps.css" />
</head>
<body>

  <div id="screen">
    <main id="desktop" aria-label="Bureau">
      <div id="wallpaper"></div>
      <div id="desktop-icons"></div>
    </main>
    <div id="windows"></div>
    <nav id="menubar" aria-label="Barre de menus"></nav>
    <div id="dock" aria-label="Dock"></div>
    <div id="notifications" aria-live="polite"></div>
    <div id="menus"></div>
    <div id="spotlight" hidden></div>
    <div id="dimmer" aria-hidden="true"></div>
  </div>

  <!-- Écran de verrouillage -->
  <div id="lock" hidden>
    <div id="lock-bg"></div>
    <div class="lock__top">
      <p id="lock-date"></p>
      <p id="lock-time"></p>
    </div>
    <div class="lock__user">
      <div class="lock__avatar">I</div>
      <p>Invité</p>
      <button id="lock-enter" class="lock__btn">Ouvrir la session <span aria-hidden="true">→</span></button>
    </div>
  </div>

  <!-- Démarrage -->
  <div id="boot" aria-label="Démarrage de Nimbus">
    <svg viewBox="0 0 24 24" class="boot__logo" aria-hidden="true"><path d="M7.2 18.5a4.7 4.7 0 0 1-.6-9.36 6 6 0 0 1 11.3 1.6 3.9 3.9 0 0 1-.4 7.76Z" fill="currentColor"/></svg>
    <div class="boot__track"><span id="boot-bar"></span></div>
  </div>

  <noscript><p class="noscript">Nimbus a besoin de JavaScript pour fonctionner.</p></noscript>

  <script src="js/core.js"></script>
  <script src="js/fs.js"></script>
  <script src="js/wm.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/apps/files.js"></script>
  <script src="js/apps/notes.js"></script>
  <script src="js/apps/terminal.js"></script>
  <script src="js/apps/settings.js"></script>
  <script src="js/apps/photos.js"></script>
  <script src="js/apps/music.js"></script>
  <script src="js/apps/calculator.js"></script>
  <script src="js/apps/calendar.js"></script>
  <script src="js/apps/browser.js"></script>
  <script src="js/apps/mail.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
